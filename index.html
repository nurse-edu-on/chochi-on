<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">

<style>
:root{--b9:#0a3366;--b7:#1558b0;--b5:#2b7de9;--b2:#cfe2ff;--b1:#eaf2ff;--bg:#f3f7fc;--tx:#14233a;--mu:#64748b;--ok:#12a37f;--wa:#e08a00;--r:16px}
*{box-sizing:border-box;margin:0}body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--b9),var(--b5));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 4px 16px #1558b033}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--b7);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.5px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.4px}.brand h1 b{color:#9fd0ff}.brand small{display:block;font-size:11px;opacity:.8;font-weight:500}
.search{margin-top:12px;position:relative}.search input{width:100%;border:0;border-radius:12px;padding:12px 14px 12px 38px;font-size:15px;background:#ffffffee;color:var(--tx);outline:0}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:20px;color:var(--b7)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

.meta{margin:4px 16px 40px;font-size:12px;color:var(--mu);text-align:center}

.act{display:inline-block;font-size:13px;font-weight:800;padding:4px 12px;border-radius:99px;color:#fff;margin-right:5px}

</style></head><body>

"id": 16, "cat": "배설", "en": "UR manual irrigation", "kr": "수동 방광세척", "actor": "공통PA", "note": "", "main": "ur_manual_irrigation_main.jpg", "detail": ["ur_manual_irrigation_detail.jpg"], "items": "• 클린조\n• 관장용 50cc 주사기\n• Bowl\n• 알콜솜\n• Gauze(휴지)\n• 멸균장갑\n• 방수포", "bill": "• Urethra & Bladder Irrigation[1일당]", "tip": "⚠ 하루에 여러 번 시도해도 한번만 처방", "nurse": "• 예) Foley catheter통하여 N/S 300ml사용하여 Manual irrigation시행함. (예: 소변량, 소변색, blood clot 유무)", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 17, "cat": "검사/검체", "en": "Blood culture", "kr": "혈액배양", "actor": "인턴", "note": "당직시간에는 공통PA", "main": "blood_culture_main.jpg", "detail": ["blood_culture_detail.jpg"], "items": "• 일회용 Dressing set\n• 알콜 스왑, 베타딘 스왑\n• 알콜솜\n• Blood culture bottle 2개\n• 10cc 주사기\n• Peri: Scalp needle, 토니켓, 지혈 밴드\n• Port·PICC·Hickman: Heparin cap, 파라필름\n• Port·PICC·Hickman: 생리식염수, 헤파린 1000iu\n• 멸균장갑", "bill": "• 하이플러스 (채혈주사기 10CC + 알콜솜)\n• 알리밴드(멸균반창고) / 4 x 9\n• 안전나비침 / 23G", "tip": "⚠ 혐기성(anaerobic, 산소가 없는 환경에서 잘 자라는 균) 용기에 먼저 넣기(주황->초록)\n⚠ Site당 1 set 준비 (Peri: 2개 / Port: 3개 / Hickman: 5개, lumen마다 1 set추가)\n⚠ Port·PICC·Hickman 채혈 시 순서: 파라필름 제거·알코올 솜 → 장갑 → heparin cap 제거·헥시타놀소독 → 기존 헤파린 포함 blood 10cc 이상 빼기 → 다른 주사기로 채혈 → N/S 주입 → heparin 주입 → 헥시타놀소독·heparin cap 닫고 파라필름·gauze로 감싸기\n⚠ lumen 색깔별 locking 종류 확인 (예: 파랑 H/L, 흰색 fluid, 빨강 S/L·sample), lumen에 해당되는 용액으로  locking하기 (N/S 단독 또는 Heparin포함)", "nurse": "① 바코드 출력 → ② 바코드 재출력에서 검사항목 클릭 → ③ 채혈자/인계자 입력클릭 →\n④ 채혈부위 선택 후 채혈 부위 기재 → ⑤ 채혈자 사번 입력  후 저장", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 18, "cat": "검사/검체", "en": "Urine culture", "kr": "소변배양", "actor": "간호사 직접", "note": "남자환자는 공통PA", "main": "urine_culture_main.jpg", "detail": ["urine_culture_detail.jpg"], "items": "• 일회용 Dressing set\n• 소독솜(Saline ball, Betadine ball)\n• Nelaton catheter(14~16Fr 1개)\n• Gauze\n• 윤활제\n• 멸균장갑\n• 소변기\n• [Clean catch] Culture 통 + cotton ball + 생리식염수, 위생장갑\n• [Foley에서 채취] 멸균 장갑, 10cc 주사기, 베타딘", "bill": "• Nelaton Catheterization[1회당]\n• 애드고패드\n• NELATON CATHETER STERILE (14FR / 16FR)\n• DAYO SKIN COVER(10G / 20G)", "tip": "⚠ Clean catch: 요도구를 닦고 중간뇨를 받도록 환자에게 설명\n⚠ Foley 채취: 손위생·멸균 장갑 → 포트 베타딘 소독 → 멸균 주사기로 채취 → 소독 → 검체 용기에 담고 장갑 제거 후 손위생", "nurse": "• Nelaton으로 채취한 경우: Nelaton catheterization시행함. by PA ○○○", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 19, "cat": "검사/검체", "en": "ABGA", "kr": "동맥혈 가스검사", "actor": "공통PA", "note": "", "main": "abga_main.jpg", "detail": ["abga_detail.jpg"], "items": "• ABGA syringe\n• 알콜솜", "bill": "• 하이플러스 (ABGA SYRINGE 3CC + 알콜솜)", "tip": "⚠공기방울 제거: PaO₂와 PaCO₂ 결과에 영향을 줄 수 있음.\n⚠검사 후 접수 빠른 진행", "nurse": "", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 20, "cat": "검사/검체", "en": "DRE", "kr": "직장수지검사", "actor": "인턴", "note": "Melena 확인(과산화수소 거품)은 간호사", "main": "dre_main.jpg", "detail": ["dre_detail.jpg"], "items": "• 윤활제\n• Gauze\n• 멸균장갑\n• 과산화수소 (melena 확인용)", "bill": "• DAYO SKIN COVER(10G / 20G)", "tip": "⚠ Melena 확인: 대변에 과산화수소를 소량 부어 거품이 일어나는지 확인 (간호사 시행)", "nurse": "• DRE 시행함. By 인턴 ○○○, (R: positive)", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 21, "cat": "검사/검체", "en": "Central line blood sampling", "kr": "중심정맥관 채혈", "actor": "간호사 직접", "note": "", "main": "cline_sampling_main.jpg", "detail": ["cline_sampling_detail.jpg"], "items": "• 일회용 Dressing set\n• 헥시타놀 스왑\n• 알콜솜\n• 5cc 주사기 (heparin locking시)\n• 10cc 주사기 3개\n• heparin cap\n• 파라필름\n• (의사처방) N/S 20cc 또는 heparin 1000iu\n• Gauze\n• 멸균장갑", "bill": "• 애드고패드\n• 하이플러스 (채혈주사기 10CC + 알콜솜)\n• 알리밴드(멸균반창고) / 4 x 9", "tip": "⚠ CRBSI 주의, aseptic 시행\n⚠ 순서: 파라필름 제거·알코올 솜 → 장갑 → heparin cap 제거·헥시타놀소독 → 기존 헤파린 포함 blood 10cc 이상 빼기 → 다른 주사기로 채혈 → N/S 주입 → heparin 주입 → 헥시타놀소독·heparin cap 닫고 파라필름·gauze로 감싸기\n⚠ lumen 색 확인 후 시행 (예: 파랑 H/L, 흰색 fluid, 빨강 S/L·sample), lumen에 해당되는 용액으로  locking하기 (N/S 단독 또는 Heparin포함)", "nurse": "", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 22, "cat": "소화기", "en": "L-tube insertion", "kr": "비위관 삽입", "actor": "공통PA", "note": "", "main": "ltube_insert_main.jpg", "detail": ["ltube_insert_detail.jpg"], "items": "• L-Tube (16~18Fr 1개)\n• 윤활제\n• 50cc 세정용 주사기\n• 청진기\n• 고정용 반창고 (Nose tape)\n• 멸균장갑", "bill": "• L-Tube Insertion\n• Stomach(Gastric) Tube (16FR / 18FR)\n• MULTIFIX / L-I(GT)\n• K-VAC / 1500ML (drain시)", "tip": "⚠ [코끝 → 귓볼 → 명치] 길이 측정 후 표시하며, 삽입 후 50cc 주사기로 공기 주입음(Gurgling) 청진 필수\n⚠ 연결 후 튜브가 당겨지거나 빠지지 않도록 면반창고와 안전핀으로 환자 의복에 고정", "nurse": "• 예) L-tube 16Fr insert함. by PA ○○○\n• 삽입 길이 (cm)\n• 간호활동-위장관삽입관-L-tube, Flowsheet-간호사정-위장관삽입관", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 23, "cat": "호흡기", "en": "Tracheostomy tube change", "kr": "T-tube change", "actor": "인턴", "note": "", "main": "trach_tube_change_main.jpg", "detail": ["trach_tube_change_detail.jpg"], "items": "• 일회용 Dressing set\n• 소독솜 (Saline ball, 과산화수소 ball)\n• Tracheostomy tube (환자 사용하는 제품)\n• 윤활제\n• Y-Gauze 또는 T베타폼\n• 10cc 주사기 2개\n• 멸균장갑", "bill": "• Simple Dressing[1일당]-Head\n• 애드고패드\n• SILICONE TRACHEOSTOMY TUBE / 7.5PR / 유신 (주로사용, 환자가 사용하는 제품처방)\n• BETAFOAM  T 3MM / 5*5CM\n• DAYO SKIN COVER(10G / 20G)", "tip": "⚠ 환자 사용하는 Tracheostomy tube 미리 처방하여 prep하도록 함", "nurse": "• 예) Tracheostomy (○Fr, 제품이름)tube change시행함. by PA ○○○ Ballooning 용량 (○cc)\n• 간호활동-인공기도관-Tracheostomy tube, Flowsheet-간호사정-인공기도관", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 24, "cat": "호흡기", "en": "Suction prep", "kr": "기관 내 흡인 준비", "actor": "간호사 직접", "note": "", "main": "suction_prep_main.jpg", "detail": ["suction_prep_detail.jpg"], "items": "• 흡인 캐니스터, 라이너 백(이너백)\n• Suction Catheter (성인 보통 12~14Fr)\n• 멸균장갑\n• 생리식염수\n• Oral airway(필요시)", "bill": "• Suction Drainage & Tracheostomy Suction[1일당]\n• M-FIX FR(Suction cath) Latex (FR12 / FR14)\n• SILILOCK / RT7-C1-2T / 씰리메드\n• AIR WAY (MEDIUM / LARGE)", "tip": "⚠ Latex catheter의 경우 T-tube, Oral suction시 사용, PVC catheter의 경우 Endotracheal tube에 사용\n⚠ 카테터 진입 시 음압 금지(무압 진입). 뺄 때 회전시키며 1회당 10~15초 이내로 시행하여 저산소증 예방", "nurse": "• 예) Oral suction시행함.\n• 흡인 전후 호흡음 및 산소포화도(SpO2)\n• 객담 양상 (색깔, 점도, 양)", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 25, "cat": "호흡기", "en": "Nebulizer", "kr": "네뷸라이저", "actor": "간호사 직접", "note": "", "main": "nebulizer_main.jpg", "detail": ["nebulizer_detail.jpg"], "items": "• 네블라이저 기계\n• 네블라이저 kit (mouth용 또는 mask용)\n• 처방 약물 (아트로핀 / 뉴코미스트 / 벤톨린)", "bill": "• Nebulizer Treatment[1일당]\n• NEBULIZER KIT & MASK (마우스피스형)\n• NEBULIZER KIT & MASK (성인마스크일체형)\n• Inhalation Syringe (흡입용주사기) / 10CC", "tip": "⚠ Ventolin 네뷸 2.5mg : 단독 사용이 원칙, 단, ‘의사의 처방에 따라’ atrovent와 ventolin nubul.은 혼합사용 가능.\n⚠ Atrovent UDV nebulizer solution : 단독사용이 원칙.\n⚠ 보령 뮤코미스트 액 10% : 10% 용액은 희석하지 않고 사용\n⚠ 풀미칸 분무용 현탁액 : 흡입 직후 가글 및 양치(아구창 또는 칸디다 예방)\n⚠ 순서 : 벤토린 → 아트로벤트 → 풀미칸 → 뮤코미스트 (단, 객담이 많아 약물흡입이 어려운 경우 뮤코미스트를 먼저 시행)\n⚠ PENTAMIDINE Nebulizer시(septrin 부작용으로 복용못할경우)\n1) PENTAMIDINE 1@을 water for injection 4cc에 mix(N/S에 희석하면 결정생김)\n2) 1,2인실로 격리해서 Nebulizer시행(보통 1달 간격)\n3) 사용한 병실은 1-2시간 환기 필요", "nurse": "", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 26, "cat": "호흡기", "en": "High Flow", "kr": "고유량 산소요법", "actor": "간호사 직접", "note": "", "main": "high_flow_main.jpg", "detail": ["high_flow_detail.jpg"], "items": "• High Flow 기계\n• High flow circuit\n• WFI (water for inject) 증류수", "bill": "• Heated Humidified High Flow Nasal Cannula\n• T-tube용 :  FISHER&PAYKEL AIRVO BREATING CIRCUIT / 900PT561, OPT970 / FISHER\n• Nasal용 : FISHER&PAYKEL AIRVO BREATING CIRCUIT / 성인/900PT561 / FISHER\n• O2 (15L~70L)L/MIN", "tip": "⚠ O2 처치료는 각 Duty때 해당 L에 60(분) * 시간\n⚠ 예) 40% 40L/min 00am~8am, 50% 50L/min 8am~11am 까지 적용할 경우 → 40L 60(분)*8(시간)=480 처방, 50L 60(분)*3(시간)=180 처방", "nurse": "• 예) High Flow 50% 50L 처방나 적용함.\n• V/S, 호흡양상", "date": "2026-11-05", "rev": "이은미", "status": "확정"}, {"id": 27, "cat": "상처/배액관", "en": "ENBD connection", "kr": "ENBD 연결", "actor": "공통PA", "note": "", "main": "enbd_connect_main.jpg", "detail": ["enbd_connect_detail.jpg"], "items": "• Baro vac\n• Extension line (180cm, 도르래)\n• 3-way\n• 면반창고\n• 멸균장갑", "bill": "• Natural Drainage & Care after Operation[ const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
